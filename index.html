<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى جلوريا - قريباً</title>
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;

            margin: 0;

            border-radius: 10px;
            border-top: 5px solid #fde100; /* اللون الأصفر من اللوجو */
            text-align: right;
        }
        .info-item { margin: 10px 0; font-size: 1.1rem; }
        a { color: #00467f; text-decoration: none; font-weight: bold; }

</head>

            <div class="info-item">📞 <a href="tel:0221813131">02 21813131</a> (32 - 33 - 34 - 35)</div>

        </div>
    </div>
</body>
</html>
